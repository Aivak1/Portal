<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Page</title>
</head>
<body>
<h1>Welcome, <span id="username"></span>!</h1>
<p>Your role: <span id="userrole"></span></p>
<button id="adminBtn" style="display:none">Admin Panel</button>
<script>
    async function loadUser() {
        const token = localStorage.getItem('token');
        if (!token) return window.location.href = 'login.html';

        const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token }});
        if (res.status !== 200) return window.location.href = 'login.html';

        const user = await res.json();
        document.getElementById('username').innerText = user.name;
        document.getElementById('userrole').innerText = user.role;
        if (user.role === 'admin') document.getElementById('adminBtn').style.display = 'block';
    }

    loadUser();
</script>
</body>
</html>
