<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Вход</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f9fbfd 0%, #f0f4f8 100%);
            color: #24292f;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* === Частицы на фоне === */
        .particle {
            position: absolute;
            z-index: -1;
            opacity: 0.7;
            will-change: transform;
            filter: blur(2px);
        }
        .particle-1 { width: 120px; height: 120px; top: 15%; left: 10%; background: radial-gradient(circle, #4bc9c1 0%, transparent 70%); animation: floatA 24s infinite ease-in-out; }
        .particle-2 { width: 160px; height: 160px; bottom: 20%; right: 8%; background: radial-gradient(circle, #765ec0 0%, transparent 70%); animation: floatB 30s infinite ease-in-out reverse; }
        .particle-3 { width: 100px; height: 100px; top: 60%; left: 30%; background: radial-gradient(circle, #0969da 0%, transparent 70%); animation: floatA 26s infinite ease-in-out; filter: blur(3px); }

        @keyframes floatA {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25%  { transform: translate(30px, -20px) rotate(2deg); }
            50%  { transform: translate(-20px, -30px) rotate(-2deg); }
            75%  { transform: translate(10px, 25px) rotate(1deg); }
        }
        @keyframes floatB {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-40px, 10px) rotate(-3deg); }
            66% { transform: translate(25px, -30px) rotate(2deg); }
        }

        /* === Форма входа === */
        .login-container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(200, 210, 220, 0.45);
            box-shadow:
                    0 8px 32px rgba(100, 120, 140, 0.08),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.7),
                    0 0 0 1px rgba(9, 105, 218, 0.2);
            animation: fadeIn 0.5s ease-out, contourPulse 8s ease-in-out infinite;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* === СФЕРА === */
        .sphere-wrapper {
            position: relative;
            display: inline-block;
            margin: 0 auto 26px;
        }

        .sphere {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(
                    135deg,
                    #4bc9c1, #765ec0, #0969da, #4bc9c1, #9b76d6, #4bc9c1
            );
            background-size: 600% 600%;
            opacity: 0;
            position: relative;
            box-shadow:
                    0 6px 18px rgba(75, 201, 193, 0.35),
                    inset -4px -4px 8px rgba(255, 255, 255, 0.2),
                    inset 4px 4px 8px rgba(0, 0, 0, 0.06);
            animation:
                    fadeInItem 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) 0.1s forwards,
                    breathe 8s cubic-bezier(0.32, 0.01, 0.28, 1) 0.7s infinite,
                    floatGently 16s cubic-bezier(0.28, 0.11, 0.26, 0.99) 0.7s infinite,
                    smoothColor 30s linear 0.7s infinite;
            will-change: transform, background-position;
            cursor: pointer;
        }

        /* === ТЕКСТ ПРИ НАВЕДЕНИИ === */
        .sphere-tooltip {
            position: absolute;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 13px;
            font-weight: 600;
            color: #0969da;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            text-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }

        .sphere-wrapper:hover .sphere-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Анимации сфера */
        @keyframes breathe {
            0%, 100% { transform: scale(1) skew(0, 0); }
            25% { transform: scale(1.04) skew(0.6deg, -0.3deg); }
            50% { transform: scale(1.07) skew(-0.5deg, 0.4deg); }
            75% { transform: scale(1.05) skew(0.3deg, -0.2deg); }
        }

        @keyframes floatGently {
            0%, 100% { transform: translate(0, 0) scale(1) skew(0, 0); }
            25%  { transform: translate(12px, -8px) scale(1.04) skew(0.4deg, -0.2deg); }
            50%  { transform: translate(0, 14px) scale(1.07) skew(-0.4deg, 0.3deg); }
            75%  { transform: translate(-12px, -8px) scale(1.05) skew(0.2deg, -0.1deg); }
        }

        @keyframes smoothColor {
            0%   { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes contourPulse {
            0%, 100% {
                box-shadow:
                        0 8px 32px rgba(100, 120, 140, 0.08),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.7),
                        0 0 0 1px rgba(9, 105, 218, 0.2);
            }
            50% {
                box-shadow:
                        0 8px 32px rgba(100, 120, 140, 0.08),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.7),
                        0 0 0 1px rgba(75, 201, 193, 0.35);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 32px;
            text-align: center;
            color: #1f2937;
            opacity: 0;
            animation: fadeInTitle 0.6s ease-out 0.25s forwards;
        }

        @keyframes fadeInTitle {
            to { opacity: 1; }
        }

        .input-group {
            margin-bottom: 28px;
            opacity: 0;
            transform: translateY(6px);
            animation: fadeInItem 0.5s ease-out forwards;
        }
        .input-group:nth-child(2) { animation-delay: 0.4s; }
        .input-group:nth-child(3) { animation-delay: 0.55s; }

        @keyframes fadeInItem {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-wrapper {
            position: relative;
            margin-top: 20px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 0 8px 0;
            border: none;
            border-bottom: 1px solid #d0d7de;
            background: transparent;
            color: #1f2937;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }
        .input-wrapper input:focus {
            border-bottom-color: #0969da;
        }

        .input-wrapper label {
            position: absolute;
            top: 14px;
            left: 0;
            font-size: 16px;
            color: #6e7781;
            pointer-events: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .input-wrapper input:focus ~ label,
        .input-wrapper input:not(:placeholder-shown) ~ label {
            top: -2px;
            font-size: 13px;
            color: #0969da;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #765ec0, #4bc9c1);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px rgba(118, 94, 192, 0.25);
            opacity: 0;
            animation: fadeInItem 0.5s ease-out 0.7s forwards;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(118, 94, 192, 0.4);
        }

        .links {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            opacity: 0;
            animation: fadeInItem 0.5s ease-out 0.85s forwards;
        }
        .links a {
            color: #0969da;
            text-decoration: none;
            position: relative;
            padding-bottom: 2px;
        }
        .links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1.5px;
            background: currentColor;
            border-radius: 1px;
            transition: width 0.4s ease;
        }
        .links a:hover::after {
            width: 100%;
        }

        input::placeholder {
            opacity: 0;
        }
    </style>
</head>
<body>

<!-- Частицы -->
<div class="particle particle-1"></div>
<div class="particle particle-2"></div>
<div class="particle particle-3"></div>

<div class="login-container">
    <!-- Обёртка для сферы и подсказки -->
    <div class="sphere-wrapper">
        <div class="sphere"></div>
        <div class="sphere-tooltip">FIN AI SOON</div>
    </div>

    <h1>Войти в аккаунт</h1>
    <form action="/login" method="POST">
        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" name="email" placeholder=" " required>
                <label>Электронная почта</label>
            </div>
        </div>
        <div class="input-group">
            <div class="input-wrapper">
                <input type="password" name="password" placeholder=" " required>
                <label>Пароль</label>
            </div>
        </div>
        <button type="submit">Войти</button>
    </form>
    <div class="links">
        <a href="/register.html">Ещё нет аккаунта? Зарегистрироваться</a>
    </div>
</div>
</body>
</html>
